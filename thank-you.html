<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Q-ARNE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0A0C10; --panel:#0F1319; --line:#1B2028;
      --text:#EDEFF3; --muted:#9AA6B8; --brand:#3E8EF7;
    }
    *{box-sizing:border-box}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:grid; place-items:center; margin:0; padding:24px;
    }
    .card{
      max-width:520px; padding:40px; background:var(--panel);
      border:1px solid var(--line); border-radius:10px; text-align:center;
    }
    .eyebrow{
      display:block; font-size:.8rem; font-weight:600; color:var(--brand);
      text-transform:uppercase; letter-spacing:.12em; margin:0 0 16px;
    }
    h1{font-weight:700; margin:0 0 14px; font-size:1.6rem; letter-spacing:-0.01em}
    p{color:var(--muted); margin:0 0 26px; font-size:1rem; line-height:1.6}
    a.btn{
      display:inline-block; padding:11px 22px; border-radius:6px;
      background:var(--brand); color:#08111f; text-decoration:none; font-weight:600;
      transition:filter .2s ease;
    }
    a.btn:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Q-ARNE</span>
    <h1>Thanks — we've received your message.</h1>
    <p>We'll review your details and follow up. If it's urgent, email us directly at <strong>connect@q-arne.com</strong>.</p>
    <a class="btn" href="/">Back to homepage</a>
  </div>
</body>
</html>
